terraform_backend_defaults:
  type: gcs
  configuration:
    bucket:

vars:
  project_id:
  deployment_name: gke-a4x-max-bm
  region: us-central1
  zone: us-central1-a
  authorized_cidr:
  static_node_count: 2
  num_node_pools: 1

  # (Optional) Spot VM pricing (default: false)
  spot: false

  # (Optional) GCE Reservation name
  # reservation: <RESERVATION_NAME>

  # (Optional) Local Kueue queue name (default: a4)
  queue_name: a4

  # A4X Max Bare Metal Flavor Settings (4x NVIDIA GB300 GPUs per node, Bare Metal NVL72)
  machine_type: a4x-maxgpu-4g-metal
  accelerator_type: nvidia-gb300
  accelerator_count: 4
  gpu_rdma_network_count: 4
  disk_type: hyperdisk-balanced
  target_architecture: arm64
  version_prefix: "1.35.5-gke.1057002"

  # Feature Flags
  enable_dranet: true
  enable_asapd_lite: true
  workload_policy_type: HIGH_THROUGHPUT
  accelerator_topology: "1x72"
  group_placement_max_distance: 0
