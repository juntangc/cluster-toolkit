terraform_backend_defaults:
  type: gcs
  configuration:
    bucket:

vars:
  project_id:
  deployment_name: gke-a4
  region: us-central1
  zone: us-central1-a
  authorized_cidr:
  static_node_count: 2
  num_node_pools: 1

  # (Optional) Spot VM pricing (default: false)
  spot: false

  # (Optional) GCE Reservation name
  # reservation: <RESERVATION_NAME>

  # (Optional) Local Kueue queue name (default: a4)
  queue_name: a4

  # A4 Flavor Settings (8x NVIDIA B200 GPUs per node)
  machine_type: a4-highgpu-8g
  accelerator_type: nvidia-b200
  accelerator_count: 8
  gpu_rdma_network_count: 8
  disk_type: pd-balanced
  target_architecture: x86_64
  version_prefix: "1.35."

  # Feature Flags
  enable_dranet: false
  enable_asapd_lite: false
  workload_policy_type: ""
  accelerator_topology: ""
  group_placement_max_distance: 2
