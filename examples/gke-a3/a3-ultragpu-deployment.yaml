---
terraform_backend_defaults:
  type: gcs
  configuration:
    bucket:

vars:
  deployment_name: gke-a3-ultra
  project_id:
  region: us-central1
  zone: us-central1-a
  authorized_cidr:
  static_node_count: 2
  # (Optional) Spot VM pricing (default: false)
  spot: false

  # (Optional) GCE Reservation name. If omitted or left blank, NO_RESERVATION will be used.
  # reservation: <RESERVATION_NAME>

  # (Optional) Local Kueue queue name (default: a3-gpu)
  queue_name: a3-gpu

  # A3 Ultra Flavor
  machine_type: a3-ultragpu-8g
  accelerator_type: nvidia-h200-141gb
  accelerator_count: 8
  gpu_network_count: 8
  nccl_installer_manifest: $(ghpc_stage("./nccl-rdma-installer.yaml.tftpl"))
  nccl_plugin_version: v1.1.2
