---
terraform_backend_defaults:
  type: gcs
  configuration:
    bucket:

vars:
  deployment_name: gke-a3-mega
  project_id:
  region: us-central1
  zone: us-central1-b
  authorized_cidr:
  static_node_count: 2
  reservation:

  # A3 Mega Flavor
  machine_type: a3-megagpu-8g
  accelerator_type: nvidia-h100-mega-80gb
  accelerator_count: 8
  gpu_network_count: 8
  nccl_installer_manifest: $(ghpc_stage("./nccl-tcpxo-installer.yaml.tftpl"))
  nccl_plugin_version: v1.0.15
