terraform_backend_defaults:
  type: gcs
  configuration:
    # The GCS bucket used for storing terraform state
    bucket:

vars:
  # Your GCP Project ID
  project_id:

  # Unique deployment name
  deployment_name: gke-tpu-v6e

  # The GCP Region and Zone for this deployment.
  # Example: us-east5, us-east5-c
  region:
  zone:

  # The number of TPU slices to create
  num_slices: 1

  # TPU v6e machine type
  machine_type: ct6e-standard-4t

  # The TPU placement topology for pod slice node pool.
  # Options: 2x4 (2 nodes, 8 chips), 4x4 (4 nodes, 16 chips), 4x8 (8 nodes, 32 chips), 8x8 (16 nodes, 64 chips), 8x16 (32 nodes, 128 chips), 16x16 (64 nodes, 256 chips)
  # See: https://docs.cloud.google.com/tpu/docs/v6e#topologies
  tpu_topology: 2x4

  # Cidr block containing the IP of the machine calling terraform.
  # To allow all (IAM restrictions still enforced), use 0.0.0.0/0
  # To allow only your IP address, use <YOUR-IP-ADDRESS>/32
  authorized_cidr:

  # The name of the compute engine reservation of TPU v6e nodes (optional)
  # Leave empty if using On-Demand or Spot VMs
  reservation: ""

  # Set to true to provision TPU nodes as Spot VMs (only valid when reservation is empty)
  spot: false

  # TPU node pool boot disk type (hyperdisk-balanced by default for v6e)
  node_pool_disk_type: hyperdisk-balanced
  node_pool_disk_size_gb: 100

  # Accelerator type for Kueue configuration
  accelerator_type: tpu-v6e-slice

  # The namespace to be configured for running workloads
  user_namespace: default

  # The Kueue LocalQueue name to be configured
  queue_name: user-queue
