# Kubernetes Pod designed to test a TPU 7x node in GKE.
# Schedules a privileged container, installs latest JAX / libtpu libraries,
# and verifies detected TPU chips.
apiVersion: v1
kind: Pod
metadata:
  name: tpu-job-jax-tpu7x
spec:
  restartPolicy: Never
  nodeSelector:
    cloud.google.com/gke-tpu-accelerator: tpu7x
    cloud.google.com/gke-tpu-topology: 2x2x1
  containers:
  - name: tpu-job
    image: python:3.12
    ports:
    - containerPort: 8431
    securityContext:
      privileged: true
    command:
    - bash
    - -c
    - |
      set -ex
      pip install -U --pre jax jaxlib libtpu requests -i https://us-python.pkg.dev/ml-oss-artifacts-published/jax/simple/ -f https://storage.googleapis.com/jax-releases/libtpu_releases.html
      python -c 'import jax; print("Global device count:", jax.device_count())'
    resources:
      requests:
        google.com/tpu: 4
      limits:
        google.com/tpu: 4
