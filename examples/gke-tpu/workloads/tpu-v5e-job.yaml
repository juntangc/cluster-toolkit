# Ready-to-run JAX TPU v5e workload for the default deployment (ct5lp-hightpu-4t, topology 2x2).
# Queued and managed via Kueue.
apiVersion: batch/v1
kind: Job
metadata:
  name: tpu-v5e-jax-job
  labels:
    kueue.x-k8s.io/queue-name: user-queue
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v5-lite-podslice
        cloud.google.com/gke-tpu-topology: 2x2
      containers:
      - name: jax-tpu
        image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:latest
        ports:
        - containerPort: 8471
        - containerPort: 8080
        - containerPort: 8431
        securityContext:
          privileged: true
        command:
        - bash
        - -c
        - |
          python -c 'import jax; print("Global device count:", jax.device_count()); print("Local device count:", jax.local_device_count()); print("Devices:", jax.devices())'
          sleep 30
        resources:
          limits:
            google.com/tpu: 4
          requests:
            google.com/tpu: 4
