# Ready-to-run JAX TPU v6e workload for the default deployment (ct6e-standard-4t, topology 2x4, 8 chips / 2 hosts).
# Queued and managed via Kueue.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: tpu-v6e-jax-job
  labels:
    kueue.x-k8s.io/queue-name: user-queue
spec:
  failurePolicy:
    maxRestarts: 4
  replicatedJobs:
  - name: tpu-worker
    replicas: 1
    template:
      spec:
        parallelism: 2
        completions: 2
        backoffLimit: 0
        template:
          metadata:
            labels:
              kueue.x-k8s.io/queue-name: user-queue
          spec:
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            restartPolicy: Never
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
              cloud.google.com/gke-tpu-topology: 2x4
            containers:
            - name: jax-tpu
              image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:latest
              ports:
              - containerPort: 8471
              - containerPort: 8080
              - containerPort: 8431
              securityContext:
                privileged: true
              command:
              - bash
              - -c
              - |
                python -c 'import jax; print("Global device count:", jax.device_count()); print("Local device count:", jax.local_device_count()); print("Devices:", jax.devices())'
                sleep 30
              resources:
                limits:
                  google.com/tpu: 4
                requests:
                  google.com/tpu: 4
